# Publica o site no GitHub Pages a cada push na main.
# O GitHub informa a URL e o subcaminho do Pages; o build usa a URL
# (canonical, Open Graph, sitemap) e o rebase prefixa os caminhos internos.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Verificações (links, metadados, conteúdo)
        run: |
          node scripts/check-links.mjs
          node scripts/lint-content.mjs

      - name: Ajustar caminhos para o subcaminho do Pages
        run: node scripts/rebase.mjs "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
